name: One-time Gmail session restore
on:
  push:
    branches: [repair/account1-session]
permissions:
  contents: read
concurrency:
  group: glados-checkin-${{ github.repository }}
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests==2.31.0
      - name: Validate Gmail and preserve QQ
        env:
          GR_COOKIE: ${{ secrets.GR_COOKIE }}
          GLADOS_ACCOUNT1_COOKIE: ${{ secrets.GLADOS_ACCOUNT1_COOKIE }}
          GR_USER_AGENT: ${{ secrets.GR_USER_AGENT }}
          GH_TOKEN: ${{ secrets.COOKIE_UPDATE_TOKEN || secrets.REPO_ACCESS_TOKEN }}
        run: python restore_account1.py
