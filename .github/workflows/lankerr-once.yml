name: One-shot audited lankerr comparison
on:
  push:
    branches: [diagnose/lankerr-one-shot-20261114]
    paths: [.github/workflows/lankerr-once.yml]
permissions:
  contents: read
concurrency:
  group: glados-checkin-${{ github.repository }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.31.0
      - name: Compare once with read-only precheck and session preservation
        run: python probe_lankerr.py
        env:
          GR_COOKIE: ${{ secrets.GR_COOKIE }}
          GR_USER_AGENT: ${{ secrets.GR_USER_AGENT }}
          GH_TOKEN: ${{ secrets.COOKIE_UPDATE_TOKEN || secrets.REPO_ACCESS_TOKEN }}
          EXCHANGE_PLAN: 'off'
          CHECKIN_MAX_ATTEMPTS: '1'
