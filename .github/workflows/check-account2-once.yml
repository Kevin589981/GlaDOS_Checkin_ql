name: Read-only account 2 reward records
on:
  push:
    branches: [repair/account2-session]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests==2.31.0
      - name: Read recent account 2 check-in records without submitting
        env:
          GR_COOKIE: ${{ secrets.GR_COOKIE }}
          GR_USER_AGENT: ${{ secrets.GR_USER_AGENT }}
        run: python read_account2_reward.py
