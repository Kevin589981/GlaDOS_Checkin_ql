name: One-time account 2 check-in comparison
on:
  push:
    branches: [repair/account2-session]
permissions:
  contents: read
concurrency:
  group: glados-checkin-${{ github.repository }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests==2.31.0
      - name: Check account 2 once and measure reward
        env:
          GR_COOKIE: ${{ secrets.GR_COOKIE }}
          GR_USER_AGENT: ${{ secrets.GR_USER_AGENT }}
          GH_TOKEN: ${{ secrets.COOKIE_UPDATE_TOKEN || secrets.REPO_ACCESS_TOKEN }}
        run: python check_account2_once.py
