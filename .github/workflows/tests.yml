name: Checkin tests

on:
  push:
    paths:
      - '*.py'
      - requirements.txt
      - '.github/workflows/**'
  pull_request:
    paths:
      - '*.py'
      - requirements.txt
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -v
